# One-time setup: unpacks swing-agents-bundle.tar.xz into the repo, then deletes it.
# Runs automatically when the bundle is uploaded. Safe to delete this file afterwards.
name: One-time setup (unpack project)
on:
  push:
    paths: ["swing-agents-bundle.tar.xz"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          test -f swing-agents-bundle.tar.xz || { echo "no bundle"; exit 0; }
          tar -xJf swing-agents-bundle.tar.xz -C .
          git rm -q swing-agents-bundle.tar.xz
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack swing-agents project"
          git push
